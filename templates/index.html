<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Daily</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>DevOps&nbsp;Daily</h1>
      <p class="tagline">One question a day to keep your skills sharp.</p>
      <div class="mode-tabs" id="mode-tabs">
        <button class="mode-tab" data-mode="qotd">QOTD</button>
        <button class="mode-tab" data-mode="blitz">Blitz</button>
        <button class="mode-tab" data-mode="take5">Take 5</button>
        <button class="mode-tab" data-mode="ladder">Ladder</button>
      </div>
      <button id="practice-toggle" class="practice-toggle">Practice Mode: Off</button>
    </header>

    <main id="app" class="app">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <script id="topics-data" type="application/json">{{ topics | tojson }}</script>
  <script src="/static/app.js"></script>
</body>
</html>
